name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: gradle --version
      - run: gradle build --refresh-dependencies
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xray-esp-seedtools
          path: build/libs/*.jar
